name: Build Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-24.04

    name: Build Docker image
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load the image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: smartmeter-datacollector:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm smartmeter-datacollector:test smartmeter-datacollector --help
          docker run --rm smartmeter-datacollector:test test -f /data/datacollector.ini

      - name: Build multi-arch image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
