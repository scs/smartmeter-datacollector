services:
  smartmeter:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartmeter-datacollector
    container_name: smartmeter-datacollector
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Zurich}
    devices:
      - ${SMARTMETER_SERIAL_DEVICE:?set SMARTMETER_SERIAL_DEVICE in .env}:/dev/ttyUSB0
    volumes:
      - ${DATACOLLECTOR_INI:?set DATACOLLECTOR_INI in .env}:/data/datacollector.ini:rw
